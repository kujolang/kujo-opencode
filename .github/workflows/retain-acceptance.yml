name: Retain local acceptance evidence
on:
  workflow_dispatch:
    inputs:
      evidence_prefix:
        description: Checked-in acceptance record prefix
        default: 2026-10-17-promotion
        required: true
        type: string
      candidate_commit:
        description: Commit recorded in the tested candidate
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the tested archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Check the identity and completeness of imported local receipts
        env:
          ACCEPTANCE_PREFIX: ${{ inputs.evidence_prefix }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: node scripts/retain-acceptance.mjs
      - name: Retain evidence for human review; this job does not rerun local model tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-acceptance-${{ inputs.candidate_sha256 }}
          path: |
            docs/acceptance/${{ inputs.evidence_prefix }}-hosts.json
            docs/acceptance/${{ inputs.evidence_prefix }}-specialists.json
            docs/acceptance/${{ inputs.evidence_prefix }}-lifecycle.json
            docs/acceptance/${{ inputs.evidence_prefix }}-dispatch.json
          if-no-files-found: error
          retention-days: 90
