name: Verify release inputs
description: Download and validate one reviewed immutable candidate without publishing
inputs:
  candidate-run-id:
    required: true
  candidate-sha256:
    required: true
  acceptance-json:
    required: true
outputs:
  archive:
    value: ${{ steps.gate.outputs.archive }}
  tag:
    value: ${{ steps.gate.outputs.tag }}
runs:
  using: composite
  steps:
    - name: Read authoritative repository, environment and candidate run state
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
        CANDIDATE_SHA256: ${{ inputs.candidate-sha256 }}
        ACCEPTANCE_JSON: ${{ inputs.acceptance-json }}
      run: |
        node --input-type=module <<'JS'
        import assert from 'node:assert/strict';
        import {writeFile} from 'node:fs/promises';
        const {CANDIDATE_RUN_ID:runID,CANDIDATE_SHA256:digest,GITHUB_SHA:sha,GITHUB_REF:ref,RUNNER_TEMP:tmp}=process.env;
        assert.match(runID,/^[1-9][0-9]*$/);assert.match(digest,/^[a-f0-9]{64}$/);
        assert.equal(process.env.GITHUB_REPOSITORY,'kujolang/kujo-opencode');
        const get=async path=>{const r=await fetch('https://api.github.com/repos/kujolang/kujo-opencode'+(path?'/'+path:''),{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});assert.ok(r.ok,`GitHub metadata unavailable: HTTP ${r.status}`);return r.json();};
        const [repo,environment,run]=await Promise.all([get(''),get('environments/npm-release'),get('actions/runs/'+runID)]);
        assert.equal(repo.private,false);assert.equal(run.head_sha,sha);assert.equal(run.conclusion,'success');assert.equal(run.path,'.github/workflows/release-candidate.yml');
        await writeFile(tmp+'/release-context.json',JSON.stringify({repo,environment,run,sha,ref,digest,runID}));
        await writeFile(tmp+'/release-acceptance.json',JSON.stringify(JSON.parse(process.env.ACCEPTANCE_JSON),null,2)+'\n');
        JS
    - name: Download the exact successful run artifact
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
      run: gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "kujo-candidate-$GITHUB_SHA" --dir "$RUNNER_TEMP/kujo-candidate"
    - name: Validate protected release and acceptance inventory
      id: gate
      shell: bash
      run: npm run release:gate -- "$RUNNER_TEMP/kujo-candidate" "$RUNNER_TEMP/release-context.json" "$RUNNER_TEMP/release-acceptance.json"
